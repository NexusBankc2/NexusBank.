><div id=\"cryptoMsg\" class=\"notice\" style=\"margin-top:12px;display:none\"></div></section><section class=\"card crypto-panel\" data-crypto-panel=\"send\" hidden><div class=\"crypto-panel-heading\"><span class=\"crypto-panel-icon send-icon\">↗</span><div><h2>Send Crypto</h2><p class=\"muted\">Send supported assets to an external wallet after PIN and email verification.</p></div></div><div class=\"grid grid-2\"><div class=\"field\"><label>Asset</label><select id=\"sendAsset\"><option>USDT</option><option>BTC</option></select></div><div class=\"field\"><label>Network</label><select id=\"sendNetwork\"><option>TRC20</option><option>ERC20</option><option>BTC</option></select></div><div class=\"field\"><label>Amount</label><input id=\"sendAmount\" type=\"number\" min=\"0.00000001\" step=\"0.00000001\" placeholder=\"0.00\"></div><div class=\"field\"><label>Transaction PIN</label><input id=\"sendPin\" type=\"password\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"••••••\"></div><div class=\"field\" style=\"grid-column:1/-1\"><label>Destination wallet</label><input id=\"destination\" placeholder=\"Enter destination wallet address\"></div></div><button id=\"sendCryptoBtn\" class=\"btn btn-primary btn-wide\" style=\"margin-top:12px\">Send Crypto</button><div id=\"sendMsg\" class=\"notice\" style=\"margin-top:12px;display:none\"></div></section><section class=\"card crypto-panel\" data-crypto-panel=\"wallets\" hidden><div class=\"crypto-panel-heading\"><span class=\"crypto-panel-icon wallets-icon\">▣</span><div><h2>My Wallets</h2><p class=\"muted\">Configured receiving addresses and their supported networks.</p></div></div><div id=\"wallets\" class=\"list\"><div class=\"hint\">Loading…</div></div></section><section class=\"card crypto-panel\" data-crypto-panel=\"activity\" hidden><div class=\"crypto-panel-heading\"><span class=\"crypto-panel-icon activity-icon\">◷</span><div><h2>Crypto Activity</h2><p class=\"muted\">Review your latest crypto transactions and their s  btn-primary btn-wide\" style=\"margin-top:14px\">Close</button></div></div><div id=\"nav\"></div>","/withdraw":"<div class=\"app\"><header class=\"topbar\"><div class=\"brand-block\"><div class=\"brand-mark\"><img src=\"assets/nexus-logo.png\" alt=\"NEXUS logo\"></div><div><div class=\"brand\">NEXUS</div><small>Withdraw Funds</small></div></div><div class=\"topbar-actions\"><a class=\"icon-btn\" href=\"#/notifications\">\u2667</a><a class=\"icon-btn\" href=\"#/support\">?</a><button id=\"logoutBtn\" class=\"btn btn-danger\">Sign out</button></div></header><main class=\"content\"><section class=\"card\"><span class=\"eyebrow\">Account withdrawal</span><h1>Withdraw Funds</h1><p class=\"muted\">Request a withdrawal from your NEXUS account. Pending requests remain recorded until reviewed.</p><div class=\"notice\"><strong>Available balance</strong><br><span id=\"balance\">Loading\u2026</span></div><form id=\"withdrawForm\" class=\"form-grid\" style=\"margin-top:14px\"><div class=\"field\"><label>Amount</label><input id=\"amount\" type=\"number\" min=\"0.01\" step=\"0.01\" placeholder=\"0.00\" required></div><div class=\"field\"><label>Destination / withdrawal reference</label><input id=\"destination\" placeholder=\"Bank account or destination reference\" required></div><div class=\"field\"><label>Transaction PIN</label><input id=\"pin\" type=\"password\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"\u2022\u2022\u2022\u2022\u2022\u2022\" required></div><button class=\"btn btn-primary btn-wide\">Submit Withdrawal</button></form><div id=\"result\" class=\"notice\" style=\"display:none;margin-top:12px\"></div></section></main></div><div id=\"nav\"></div>"}</script>
<script type="module">
import { supabase, profileFor, profileIsActive, profileIsDeleted } from './js/supabase.js';
const templates=JSON.parse(document.getElementById('nexus-templates').textContent);
const pageScripts={"/login":["js/login.js"],"/login-verify":["js/login-verify.js"],"/verify-email":["js/verify-email.js"],"/admin":["js/admin.js"],"/dashboard":["js/pages/dashboard.js"],"/unavailable":["js/unavailable.js"],"/account":["js/pages/account.js"],"/add-money":["js/pages/add-money.js"],"/card":["js/pages/card.js"],"/crypto":["js/pages/crypto.js"],"/notifications":["js/pages/notifications.js"],"/send-money":["js/pages/send-money.js"],"/support":["js/pages/support.js"],"/transactions":["js/pages/transactions.js"],"/withdraw":["js/pages/withdraw.js"]};
const root=document.getElementById('app-root');
// If a page module takes unusually long to initialize, show a helpful message instead of a blank screen.
const startupFallback=setTimeout(()=>{
 if(root.querySelector('#nexus-splash')){
  root.innerHTML='<main class="startup-error"><h1>NEXUS is taking longer than expected</h1><p>Check your internet connection and the JavaScript console, then reload the page.</p><button type="button" onclick="location.reload()">Reload NEXUS</button></main>';
 }
},15000);
const routeAliases={'/':'/','/index.html':'/','/pages/account':'/account','/pages/add-money':'/add-money','/pages/card':'/card','/pages/crypto':'/crypto','/pages/notifications':'/notifications','/pages/send-money':'/send-money','/pages/support':'/support','/pages/transactions':'/transactions','/pages/withdraw':'/withdraw'};
function currentRoute(){let p=decodeURI(location.hash.replace(/^#/,''))||'/';p=p.split('?')[0].replace(/\/$/,'')||'/';if(p.startsWith('/transactions/'))return '/transactions';return routeAliases[p]||p;}
function go(path,replace=false){const hash='#'+(path.startsWith('/')?path:'/'+path);if(replace)history.replaceState(null,'',hash);else location.hash=hash;}
function fixLinks(){root.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href');if(!h||h.startsWith('#')||/^(https?:|mailto:|tel:|javascript:|data:)/i.test(h))return;let p=h.split('?')[0].replace(/\.html$/,'').replace(/\/$/,'');if(p===''||p==='index')p='/';else if(p.startsWith('pages/'))p='/'+p.slice(6);else p='/'+p.replace(/^\.\//,'');const known=routeAliases[p]||p;if(templates[known]!==undefined){a.setAttribute('href','#'+known);}});}
// Preserve the current route and non-secret form values if the mobile browser
// suspends/discards this page while it is in the background. Never persist
// passwords, transaction PINs, OTPs, verification codes, or other secret fields.
const RESUME_ROUTE_KEY='nexus_resume_route_v1';
const RESUME_FORM_PREFIX='nexus_resume_form_v1:';
function safeSessionGet(key){try{const v=sessionStorage.getItem(key);if(v)return v;}catch{}try{return localStorage.getItem(key);}catch{return null;}}
function safeSessionSet(key,value){let ok=false;try{sessionStorage.setItem(key,value);ok=true;}catch{}try{localStorage.setItem(key,value);ok=true;}catch{}return ok;}
function safeSessionRemove(key){try{sessionStorage.removeItem(key);}catch{}try{localStorage.removeItem(key);}catch{}}
function isSensitiveField(el){
 const id=String(el.id||'').toLowerCase();
 const name=String(el.name||'').toLowerCase();
 const type=String(el.type||'').toLowerCase();
 const autocomplete=String(el.autocomplete||'').toLowerCase();
 const marker=[id,name,autocomplete].join(' ');
 return type==='password'||/password|(^|[-_ ])pin($|[-_ ])|otp|verification.?code|one.?time.?code|token|secret|cvv|cvc|security.?code/i.test(marker);
}
function formStateKey(route){return RESUME_FORM_PREFIX+route;}
let activeRoute=null;
function saveCurrentFormState(){
 const route=activeRoute||currentRoute();
 if(!route||route==='/'||!root)return;
 const fields=[...root.querySelectorAll('input,textarea,select')];
 const state=[];
 for(const el of fields){
  if(isSensitiveField(el)||el.disabled||el.type==='file'||el.type==='submit'||el.type==='button'||el.type==='reset')continue;
  const key=el.id?('id:'+el.id):(el.name?('name:'+el.name):'');
  if(!key)continue;
  if(el.type==='checkbox'||el.type==='radio')state.push({key,type:el.type,checked:!!el.checked});
  else state.push({key,type:el.tagName.toLowerCase(),value:el.value});
 }
 safeSessionSet(formStateKey(route),JSON.stringify(state));
 safeSessionSet(RESUME_ROUTE_KEY,route);
}
function restoreCurrentFormState(route){
 let state;
 try{state=JSON.parse(safeSessionGet(formStateKey(route))||'[]');}catch{return;}
 if(!Array.isArray(state))return;
 for(const item of state){
  let el=null;
  if(item.key?.startsWith('id:'))el=root.querySelector('#'+CSS.escape(item.key.slice(3)));
  else if(item.key?.startsWith('name:'))el=[...root.querySelectorAll('[name]')].find(x=>x.name===item.key.slice(5))||null;
  if(!el||isSensitiveField(el)||el.disabled)continue;
  if(item.type==='checkbox'||item.type==='radio')el.checked=!!item.checked;
  else if(typeof item.value==='string')el.value=item.value;
  // Trigger input/change so existing page modules can refresh their own UI.
  try{el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}catch{}
 }
}
// Save ordinary form fields as the user edits them, and save once more when
// the app is backgrounded or the browser is about to discard the document.
root.addEventListener('input',saveCurrentFormState);
root.addEventListener('change',saveCurrentFormState);
window.addEventListener('pagehide',saveCurrentFormState);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveCurrentFormState();});
// Recover a pending transfer route after Android/TrebEdit recreates the page.
// Only a non-secret request reference is persisted; OTPs/PINs/passwords are not.
try{
 const initialHash=location.hash;
 let pendingTransferId=null;
 try{pendingTransferId=localStorage.getItem('nexus_active_transfer_request_id');}catch{}
 try{if(!pendingTransferId)pendingTransferId=sessionStorage.getItem('nexus_active_transfer_request_id');}catch{}
 const routeFromHash=(initialHash||'').replace(/^#/,'')||'/';
 const authRoutes=['/login','/login-verify','/verify-email','/admin'];
 if(pendingTransferId&&!authRoutes.includes(routeFromHash)){
  history.replaceState(null,'','#/send-money');
 }else if((!initialHash||initialHash==='#'||initialHash==='#/')&&safeSessionGet(RESUME_ROUTE_KEY)){
  const savedRoute=safeSessionGet(RESUME_ROUTE_KEY);
  if(templates[savedRoute])history.replaceState(null,'','#'+savedRoute);
 }
}catch{}
let generation=0;
async function render(){
 saveCurrentFormState();
 const my=++generation;let route=currentRoute();if(route==='/'){
 try{const {data:{session}}=await supabase.auth.getSession();if(!session){route='/login';}else{const p=await profileFor(session.user.id).catch(()=>null);route=p?.role==='admin'?'/admin':((String(p?.status||'').toLowerCase()==='deactivated'||Boolean(p?.deleted_at))?'/unavailable':'/dashboard');}}
 catch(e){route='/login';}
 if(my!==generation)return;history.replaceState(null,'','#'+route);
 }
 // The unavailable route can remain in the URL when a browser tab is resumed.
 // Re-check the signed-in user's current profile before showing it. A transient
 // profile lookup failure or a stale hash must not be treated as deactivation.
 if(route==='/unavailable'){
  try{
   const {data:{session}}=await supabase.auth.getSession();
   if(!session){
    route='/login';
   }else{
    const p=await profileFor(session.user.id);
    if(!p){
     route='/login';
    }else if(profileIsActive(p) && !profileIsDeleted(p)){
     route=(p.role==='admin'||p.role==='super_admin')?'/admin':'/dashboard';
    }
   }
  }catch(error){
   console.warn('[NEXUS router] Could not verify unavailable-page state; returning to sign-in instead of assuming deactivation.',error);
   route='/login';
  }
  if(my!==generation)return;
  history.replaceState(null,'','#'+route);
 }
 if(!templates[route]){root.innerHTML='<main class="content"><section class="card"><h1>Page not found</h1><p>The requested NEXUS page does not exist.</p><a href="#/dashboard">Return to dashboard</a></section></main>';return;}
 clearTimeout(startupFallback);
  root.innerHTML=templates[route];
 document.body.dataset.page=route==='/admin'?'admin':(route==='/login'||route==='/login-verify'||route==='/verify-email'?'auth':'customer');
 document.title='NEXUS — '+route.replace(/^\//,'').replace(/-/g,' ').replace(/^\w/,x=>x.toUpperCase());
 fixLinks();
 // Run each page's existing module after its matching markup is mounted.
 for(const src of (pageScripts[route]||[])){
  let normalized=src.replace(/^\.\//,'');
  try{await import('./'+normalized+'?view='+Date.now()+'-'+my);}catch(e){console.error('NEXUS page module failed:',normalized,e);const box=root.querySelector('.content')||root;const msg=document.createElement('p');msg.className='notice';msg.textContent='This page could not initialize. Check the browser console.';box.prepend(msg);}
 }
 if(my!==generation)return;
 restoreCurrentFormState(route);
 activeRoute=route;
 safeSessionSet(RESUME_ROUTE_KEY,route);
 fixLinks();
}
root.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');if(h&&h.startsWith('#/')){e.preventDefault();if(location.hash===h)render();else location.hash=h;}});
window.addEventListener('hashchange',render);
render();
</script></body></html>
